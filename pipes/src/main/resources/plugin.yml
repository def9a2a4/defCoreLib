name: Pipes
main: anon.def9a2a4.pipes.PipesPlugin
version: ${version}
api-version: 1.21
author: You
description: Item pipes for transferring items between containers
depend: [DefCoreLib]

commands:
  pipes:
    description: Pipes commands (give, info, reload, migrate). /pipes help lists them.
    usage: /pipes help
    # No command-level permission: /pipes help is open to all, and each subcommand checks its own
    # pipes.<name> permission (pipes.admin grants them all).

permissions:
  pipes.admin:
    description: Allows access to all Pipes commands
    default: op
    children:
      pipes.reload: true
      pipes.give: true
      pipes.info: true
      pipes.delete_all: true
      pipes.migrate: true
  pipes.reload:
    description: Allows reloading the config
    default: op
  pipes.give:
    description: Allows giving pipe items
    default: op
  pipes.info:
    description: Allows viewing pipe statistics
    default: op
  pipes.delete_all:
    description: Allows deleting all pipes
    default: op
  pipes.migrate:
    description: Allows sweeping loaded chunks for legacy (v0.2.0) pipes
    default: op
