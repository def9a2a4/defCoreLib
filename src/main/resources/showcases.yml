      - { id: "mech:chain_hoist", facing: down, state: idle_z, at: [0, 1, 10], contents: ["IRON_CHAIN x16"] }   # chain to pay out
      - { id: "verticalslabs:cut_copper", facing: east, state: east, at: [-1, 1, 9] }
      - { id: "verticalslabs:cut_copper", facing: west, state: west, at: [1, 1, 9] }
