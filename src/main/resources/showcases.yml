  # ══ Test-only regression scenarios ═══════════════════════════════════════════════════════════════
  # `test_only: true`: built and asserted by `make showcase-test*` only. The docs capture never builds or
  # writes them (no entry in showcase-spec.json / showcases.json), the keep-alive docs world skips them,
  # and they have no blurb. `actions` are scripted mid-test steps; `assert_at` moves a spec's assertion
  # tick past the default 80 (the run halts at the latest one).
  #   actions: - { tick: N, do: set, block: MAT, at: [..], to: [..]?, only: MAT?, physics: bool?, data: "[..]"? }
  #            - { tick: N, do: corrupt_persisted_mechanism, at: [..] }
  #            - { tick: N, do: summon, entity: KEY, at: [..], face: F?, item: MAT?, art: KEY?, rider: KEY? }
  #   expect type block_type: value MAT (or !MAT), at + optional `to` box — every cell must match.
  #   expect type entity_count: value KEY=N (or item:MAT=N — dropped items counted by stack size) in the box.
  #   expect type riding: value RIDER/VEHICLE — some RIDER in the box rides a VEHICLE. A spec naming an
  #   entity this server lacks (cushion before 26.3) reports SKIP instead of running.
  # Items: "MAT" / "MAT xN", or { material: MAT, count: N?, name: "..."?, contents: [items]? } (a filled shulker).
  #   setup:   `contents: [items]` on a blocks/vanilla entry fills its storage, container half, lectern or pot.
  #   actions: - { tick: N, do: break, at: [..], to: [..]? }  — player-less break: a custom block spills its
  #              storage, drops itself and runs its removal callbacks (as an explosion would); vanilla blocks
  #              breakNaturally(). No BlockBreakEvent: tool/silk drop rules and break listeners don't run.
  #            - { tick: N, do: drop, at: [..], items: [items] }  — item entities at the cell centre
  #            - { tick: N, do: persist_mechanism | disassemble_mechanism | save, at: [..] }  — lift the cell
  #              into a crash-safe persisted mechanism / land that mechanism / World.save(flush)
  #   expect type contents: items [items] at a cell — exact count per listed material (`MAT x0` = none).
  #   expect type material_total: value MAT=N — dropped MAT items plus MAT blocks in the box, exactly N.
  #   expect type mechanism_count: value N — live mechanisms whose pivot is in the box.
  #   expect type mechanism_state_file: the file of the mechanism persist_mechanism lifted at `at` exists.
  #   expect type engine_fuel: value N — the engine at `at` holds at least N fuel ticks.
  # An unknown action or expect type, or an action that throws, FAILs the spec.
  # `restart: crash|clean` (+ `after_restart: [expects]`): run only by `make showcase-restart-test` — boot 1
  # builds it, runs `actions` + `expect`, then crashes (halt, no save beyond `save` actions) or stops cleanly;
  # boot 2 reloads the world and checks `after_restart`.

  # Ceiling mounts (743863d). A hung windmill is a Y-axis passive source on its `ceiling` state, so the
  # shaft ABOVE it picks it up exactly as one above a floor windmill would; a hung propeller is a Y-axis
  # consumer whose powered state must come out as `spinning_ceiling` (RotationNetwork re-prefixes the
  # idle_/spinning_ token, so this also pins that the swap keeps the ceiling suffix). Two separate
  # networks, three blocks apart.
  - id: test_ceiling_mounts
    name: "Test: ceiling windmill + propeller"
    test_only: true
    blocks:
      # Large windmill (5) hung under a shaft column, driving a fan (2) on top.
      - { id: "mech:large_windmill", facing: up,   at: [0, 0, 0] }   # → state `ceiling`
      - { id: "mech:shaft",          facing: down, at: [0, 1, 0] }
      - { id: "mech:fan",            facing: down, at: [0, 2, 0] }
      # Propeller (demand 5) hung under five co-axial motors (1 each).
      - { id: "mech:propeller",      facing: up,   at: [3, 0, 0] }   # → state `idle_ceiling`
      - { id: "mech:redstone_motor", facing: down, at: [3, 1, 0] }
      - { id: "mech:redstone_motor", facing: down, at: [3, 2, 0] }
      - { id: "mech:redstone_motor", facing: down, at: [3, 3, 0] }
      - { id: "mech:redstone_motor", facing: down, at: [3, 4, 0] }
      - { id: "mech:redstone_motor", facing: down, at: [3, 5, 0] }
    activate: passive
    expect:
      - { type: state, value: ceiling, at: [0, 0, 0] }
      - { type: network_powered, at: [0, 1, 0] }
      - { type: spinning, at: [0, 2, 0] }
      - { type: network_powered, at: [3, 0, 0] }
      - { type: state, value: spinning_ceiling, at: [3, 0, 0] }

  # Chain hoist, full reel-in. The crane can't assert hoist_moved (see its note); this one can. The hoist
  # needs CCW to reel in, and a motor-anchored domain resolves CW, so the drive goes through ONE same-axis
  # gear mesh (a reversing edge): motor [1,3,2] → gear [1,3,1] ⇄ gear [0,3,1] → hoist [0,3,0], all Z.
  # Two chain links hang below the hoist with a plank load under them. Span = 2 (the plank's upward
  # clearance is all our own rope), so the load rises 2 into [0,2,0] and both links are swallowed.
  # Speed: 1 motor vs the hoist's demand 1 → power 1, mass 1 + planks 2 → 1/12 block/tick → ~24 ticks
  # of travel; it starts within a few ticks of the build, so it has long finished by tick 80.
  - id: test_hoist_reel_in
    name: "Test: chain hoist reels in"
    test_only: true
    blocks:
      - { id: "mech:chain_hoist",    facing: down,  state: idle_z, at: [0, 3, 0] }   # builder heads face N → Z axle
      - { id: "mech:gear",           facing: north, at: [0, 3, 1] }
      - { id: "mech:gear",           facing: north, at: [1, 3, 1] }   # same-axis mesh → reverses → CCW
      - { id: "mech:redstone_motor", facing: north, at: [1, 3, 2] }
    vanilla:
      - { block: "IRON_CHAIN", at: [0, 2, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 1, 0], data: "[axis=y]" }
      - { block: "OAK_PLANKS", at: [0, 0, 0] }   # the load
    activate: passive
    expect:
      - { type: hoist_moved, at: [0, 3, 0] }
      - { type: block_type, value: OAK_PLANKS, at: [0, 2, 0] }        # load landed under the hoist
      - { type: block_type, value: AIR, at: [0, 0, 0], to: [0, 1, 0] } # vacated; no link left behind

  # Regression for the rising-hoist ghost dupe (0e2a799). Reeling in, the stroke carries a GHOST link just
  # above the load; cut short at M blocks it lands on the swallowed link at [0,M+1,0]. If that link had
  # been mined, landing used to mint a real chain into the empty cell from nothing. Same drive as above
  # with an 8-link column (a full stroke would take ~100 ticks). At tick 40 — ~3 blocks in — every
  # remaining link is aired (the "player mined it") and a redstone block switches the motor off, so the
  # stroke stops at the next whole cell. Afterwards the column must hold no chain at all.
  # Guards against a vacuous pass: hoist_moved, and the load must have left [0,0,0] (the stroke ran) but
  # NOT reached [0,8,0] (it really was cut short — a full stroke lands its ghost on the protected hoist
  # cell and would pass whether or not the fix works).
  # assert_at 110: once unpowered the hoist crawls at its 0.025 block/tick floor, so finishing the last
  # partial block can take up to 40 ticks after the cut (+3 settle) — tick ~83 worst case.
  - id: test_hoist_rising_ghost_no_dupe
    name: "Test: interrupted hoist reel-in mints no chain"
    test_only: true
    assert_at: 110
    blocks:
      - { id: "mech:chain_hoist",    facing: down,  state: idle_z, at: [0, 9, 0] }
      - { id: "mech:gear",           facing: north, at: [0, 9, 1] }
      - { id: "mech:gear",           facing: north, at: [1, 9, 1] }
      - { id: "mech:redstone_motor", facing: north, at: [1, 9, 2] }
    vanilla:
      - { block: "IRON_CHAIN", at: [0, 8, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 7, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 6, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 5, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 4, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 3, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 2, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 1, 0], data: "[axis=y]" }
      - { block: "OAK_PLANKS", at: [0, 0, 0] }   # the load
    activate: passive
    actions:
      - { tick: 40, do: set, block: AIR, only: IRON_CHAIN, at: [0, 1, 0], to: [0, 8, 0] }   # "mined" links
      - { tick: 40, do: set, block: REDSTONE_BLOCK, physics: true, at: [2, 9, 2] }          # motor off
    expect:
      - { type: hoist_moved, at: [0, 9, 0] }
      - { type: block_type, value: "!OAK_PLANKS", at: [0, 0, 0] }   # the load moved…
      - { type: block_type, value: "!OAK_PLANKS", at: [0, 8, 0] }   # …but stopped short
      - { type: block_type, value: "!IRON_CHAIN", at: [0, 1, 0], to: [0, 8, 0] }   # nothing minted

  # Regression for 8d75a15: a corrupt mechanism state file must never be culled, or the recovery pass's
  # orphan sweep reaps the mechanism's entities and its blocks are gone for good. The probe lifts the plank
  # into a persisted mechanism, parks it as a chunk unload would, overwrites its state file with garbage
  # and runs the chunk-load recovery pass (the chunk itself stays loaded — what's under test is the
  # recovery pass, not Paper's entity I/O). Expect: same tagged-entity count as when parked, and the file
  # (and its shield) still there. Logs one expected "corrupt or unreadable state file" WARNING. The probe
  # deletes the file and the entities after the report.
  - id: test_corrupt_state_file_kept
    name: "Test: corrupt mechanism state file is never culled"
    test_only: true
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 0, 0] }
    activate: passive
    actions:
      - { tick: 30, do: corrupt_persisted_mechanism, at: [0, 0, 0] }
    expect:
      - { type: persisted_mechanism_intact, at: [0, 0, 0] }

  # Carried frames + painting (AttachedEntities). A ceiling rotator turns its plank 90° about Y in place;
  # an item frame (holding a diamond) on the plank's east face and a 1×1 painting on its west face must ride
  # the turn and land on the plank's new north/south faces — not stay behind, and not drop. Runs on every
  # version (frames and paintings predate cushions).
  - id: test_carried_frame_painting
    name: "Test: item frame + painting ride a rotator"
    test_only: true
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",   facing: up,   at: [0, 0, 0] }    # ceiling hinge, Y axis → turns [0,1,0]
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 1, 0] }
    activate: { pulse: [1, 0, 0] }
    actions:
      - { tick: 5, do: summon, entity: item_frame, face: east, item: DIAMOND, at: [1, 1, 0] }
      - { tick: 5, do: summon, entity: painting, face: west, art: kebab, at: [-1, 1, 0] }
    expect:
      - { type: mechanism_swung, value: "0,1,0", at: [0, 0, 0] }
      - { type: entity_count, value: "item_frame=1", at: [-1, 1, -1], to: [1, 1, 1] }
      - { type: entity_count, value: "painting=1", at: [-1, 1, -1], to: [1, 1, 1] }
      - { type: entity_count, value: "item_frame=0", at: [1, 1, 0] }   # it turned with the plank…
      - { type: entity_count, value: "painting=0", at: [-1, 1, 0] }    # …and so did the painting
      - { type: entity_count, value: "item=0", at: [-3, -1, -3], to: [3, 3, 3] }   # nothing dropped
      - { type: frame_rotation, value: "DIAMOND=NONE", at: [-1, 1, -1], to: [1, 1, 1] }   # a wall frame's item doesn't turn

  # Cushion seat (26.3+; SKIPs on older servers). A cushion on the same turning plank, with a still pig
  # seated on it, must ride the turn (mounted on the plank's collider) and step back onto the plank with
  # the pig still seated — not pop off as an item.
  - id: test_carried_cushion
    name: "Test: seated cushion rides a rotator"
    test_only: true
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",   facing: up,   at: [0, 0, 0] }
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 1, 0] }
    activate: { pulse: [1, 0, 0] }
    actions:
      - { tick: 5, do: summon, entity: cushion, rider: pig, at: [0, 2, 0] }
    expect:
      - { type: mechanism_swung, value: "0,1,0", at: [0, 0, 0] }
      - { type: entity_count, value: "cushion=1", at: [0, 2, 0] }
      - { type: riding, value: "pig/cushion", at: [0, 2, 0], to: [0, 3, 0] }
      - { type: entity_count, value: "item=0", at: [-3, -1, -3], to: [3, 4, 3] }

  # A painting can't hang on its side: rolled 90° by a Z-axis drawbridge hinge, it must drop exactly ONE
  # painting item (not vanish, not dupe), while a frame on the same block follows the roll onto its new face.
  # An unglued rotator swings only the block it faces — the single plank at [0,0,1], which sits ON the hinge
  # axis, so it rolls in place. Its east face (the painting) turns up or down; its top face (the frame) turns
  # east or west into open air whichever way the network spins. Mass 2 → the swing ends well before tick 80.
  - id: test_painting_drops_on_roll
    name: "Test: rolled painting drops once"
    test_only: true
    blocks:
      - { id: "mech:redstone_motor", facing: north, at: [0, 0, -2] }
      - { id: "mech:reverser",  facing: north, at: [0, 0, -1] }
      - { id: "mech:rotator",   facing: south, at: [0, 0, 0] }
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 0, 1] }
      - { block: "LEVER", at: [-1, 0, -1], data: "[face=floor,facing=north,powered=true]" }
    activate: { pulse: [1, 0, 0] }
    actions:
      - { tick: 5, do: summon, entity: painting, face: east, art: kebab, at: [1, 0, 1] }
      - { tick: 5, do: summon, entity: item_frame, face: up, item: DIAMOND, at: [0, 1, 1] }
    expect:
      - { type: mechanism_swung, value: "0,0,1", at: [0, 0, 0] }
      - { type: entity_count, value: "painting=0", at: [-3, -2, -1], to: [3, 3, 3] }
      - { type: entity_count, value: "item:PAINTING=1", at: [-3, -2, -1], to: [5, 3, 6] }   # wide: a drop slides
      - { type: entity_count, value: "item_frame=1", at: [-1, 0, 1], to: [1, 0, 1] }   # rolled onto a side
      - { type: entity_count, value: "item:DIAMOND=0", at: [-3, -2, -1], to: [3, 3, 3] }

  # The floor hinge (the ceiling test's mirror): a rotator sitting ON the plank turns it in place, and the frame
  # and painting on its east/west faces must land on its new north/south faces. Power comes down from the motor
  # above; the pulse is beside the hinge, above the frame's cell.
  - id: test_carried_frame_painting_floor
    name: "Test: item frame + painting ride a floor rotator"
    test_only: true
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, 2, 0] }
      - { id: "mech:rotator",        facing: down, at: [0, 1, 0] }   # floor hinge, Y axis → turns [0,0,0]
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 0, 0] }
    activate: { pulse: [1, 1, 0] }
    actions:
      - { tick: 5, do: summon, entity: item_frame, face: east, item: DIAMOND, at: [1, 0, 0] }
      - { tick: 5, do: summon, entity: painting, face: west, art: kebab, at: [-1, 0, 0] }
    expect:
      - { type: mechanism_swung, value: "0,0,0", at: [0, 1, 0] }
      - { type: entity_count, value: "item_frame=1", at: [-1, 0, -1], to: [1, 0, 1] }
      - { type: entity_count, value: "painting=1", at: [-1, 0, -1], to: [1, 0, 1] }
      - { type: entity_count, value: "item_frame:EAST=0", at: [-1, 0, -1], to: [1, 0, 1] }   # turned to N/S
      - { type: entity_count, value: "painting:WEST=0", at: [-1, 0, -1], to: [1, 0, 1] }
      - { type: frame_rotation, value: "DIAMOND=NONE", at: [-1, 0, -1], to: [1, 0, 1] }
      - { type: entity_count, value: "item=0", at: [-3, -1, -3], to: [3, 3, 3] }

  # A 2×2 painting (even width AND height, so its centre sits on a cell edge, not mid-cell) on the north face of a
  # 3×2 wall. The two slime blocks bond the wall to the ceiling hinge, which turns it 90° about its middle column:
  # the wall ends up along Z and the painting on its east or west face (by spin direction), never still facing
  # north, with the same art and nothing dropped. The wall is 3 wide so the painting is fully backed whichever
  # side of the summon cell its second column falls.
  - id: test_carried_painting_2x2
    name: "Test: 2x2 painting rides a turning wall"
    test_only: true
    assert_at: 160
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",        facing: up,   at: [0, 0, 0] }
    vanilla:
      - { block: "SLIME_BLOCK", at: [0, 1, 0] }
      - { block: "SLIME_BLOCK", at: [0, 2, 0] }
      - { block: "OAK_PLANKS", at: [-1, 1, 0] }
      - { block: "OAK_PLANKS", at: [1, 1, 0] }
      - { block: "OAK_PLANKS", at: [-1, 2, 0] }
      - { block: "OAK_PLANKS", at: [1, 2, 0] }
    activate: { pulse: [1, 0, 0] }
    actions:
      - { tick: 5, do: summon, entity: painting, face: north, art: bust, at: [0, 1, -1] }
    expect:
      - { type: mechanism_swung, value: "0,1,0; 0,2,0; -1,1,0; 1,1,0; -1,2,0; 1,2,0", at: [0, 0, 0] }
      - { type: block_type, value: AIR, at: [-1, 1, 0], to: [-1, 2, 0] }   # the wall turned onto the Z line
      - { type: block_type, value: AIR, at: [1, 1, 0], to: [1, 2, 0] }
      - { type: material_total, value: "OAK_PLANKS=4", at: [0, 1, -1], to: [0, 2, 1] }
      - { type: entity_count, value: "painting:bust=1", at: [-2, 0, -2], to: [2, 3, 2] }
      - { type: entity_count, value: "painting:NORTH=0", at: [-2, 0, -2], to: [2, 3, 2] }
      - { type: entity_count, value: "item=0", at: [-3, -1, -3], to: [3, 4, 3] }

  # Off the hinge's axis everything MOVES, not just turns: a slime block bonds a plank to the ceiling hinge, and
  # the plank swings from [1,1,0] round to [0,1,±1] (by spin direction). What hangs on it must follow to the
  # matching cells — a floor frame on top, a wall frame on its far (east) face two cells out, a painting on its
  # south face. Floor frames turn their item a quarter: a map has 4 steps a turn (one step), any other item 8
  # (two). A wall frame's item doesn't turn at all.
  - id: test_carried_frames_move_and_turn
    name: "Test: frames + painting follow a swung plank"
    test_only: true
    assert_at: 120
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",        facing: up,   at: [0, 0, 0] }
    vanilla:
      - { block: "SLIME_BLOCK", at: [0, 1, 0] }
      - { block: "OAK_PLANKS", at: [1, 1, 0] }
    activate: { pulse: [1, 0, 0] }
    actions:
      - { tick: 5, do: summon, entity: item_frame, face: up, item: FILLED_MAP, at: [0, 2, 0] }   # on the slime
      - { tick: 5, do: summon, entity: item_frame, face: up, item: DIAMOND, at: [1, 2, 0] }      # on the plank
      - { tick: 5, do: summon, entity: item_frame, face: east, item: EMERALD, at: [2, 1, 0] }
      - { tick: 5, do: summon, entity: painting, face: south, art: kebab, at: [1, 1, 1] }
    expect:
      - { type: mechanism_swung, value: "0,1,0; 1,1,0", at: [0, 0, 0] }
      - { type: block_type, value: SLIME_BLOCK, at: [0, 1, 0] }
      - { type: block_type, value: AIR, at: [1, 1, 0] }
      - { type: material_total, value: "OAK_PLANKS=1", at: [0, 1, -1], to: [0, 1, 1] }
      - { type: frame_rotation, value: "FILLED_MAP=CLOCKWISE_45|COUNTER_CLOCKWISE_45", at: [0, 2, 0] }
      - { type: frame_rotation, value: "DIAMOND=CLOCKWISE|COUNTER_CLOCKWISE", at: [0, 2, -1], to: [0, 2, 1] }
      - { type: entity_count, value: "item_frame=0", at: [1, 2, 0] }
      - { type: frame_rotation, value: "EMERALD=NONE", at: [0, 1, -2], to: [0, 1, 2] }
      - { type: entity_count, value: "item_frame=0", at: [2, 1, 0] }
      - { type: entity_count, value: "painting=1", at: [-1, 1, -1], to: [1, 1, 1] }
      - { type: entity_count, value: "painting:SOUTH=0", at: [-1, 1, -1], to: [1, 1, 1] }
      - { type: entity_count, value: "item=0", at: [-3, -1, -3], to: [3, 3, 3] }

  # Landing into a filled cell: the plank turns in place, but stone now stands where its frame and painting would
  # land (its new north and south faces), so neither can hang there. Each must come back as its items exactly
  # once (frame + diamond, painting) — never vanish, never dupe, never overwrite the stone.
  - id: test_carried_frame_blocked_drops
    name: "Test: frame + painting drop when their landing cell is filled"
    test_only: true
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",        facing: up,   at: [0, 0, 0] }
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 1, 0] }
      - { block: "STONE", at: [0, 1, 1] }
      - { block: "STONE", at: [0, 1, -1] }
    activate: { pulse: [1, 0, 0] }
    actions:
      - { tick: 5, do: summon, entity: item_frame, face: east, item: DIAMOND, at: [1, 1, 0] }
      - { tick: 5, do: summon, entity: painting, face: west, art: kebab, at: [-1, 1, 0] }
    expect:
      - { type: mechanism_swung, value: "0,1,0", at: [0, 0, 0] }
      - { type: block_type, value: STONE, at: [0, 1, 1] }
      - { type: block_type, value: STONE, at: [0, 1, -1] }
      - { type: entity_count, value: "item_frame=0", at: [-3, -1, -3], to: [3, 3, 3] }
      - { type: entity_count, value: "painting=0", at: [-3, -1, -3], to: [3, 3, 3] }
      - { type: entity_count, value: "item:ITEM_FRAME=1", at: [-3, -1, -3], to: [3, 3, 3] }
      - { type: entity_count, value: "item:DIAMOND=1", at: [-3, -1, -3], to: [3, 3, 3] }
      - { type: entity_count, value: "item:PAINTING=1", at: [-3, -1, -3], to: [3, 3, 3] }

  # Cushions off the axis and on a carpet (26.3+; SKIPs on older servers). A slime block bonds a carpet on top of
  # it and a plank beside it to the ceiling hinge. The cushion on the carpet (pig seated) rides the slime's collider
  # — a carpet has none — and stays put on the carpet; the riderless one on the plank moves round with it to
  # [0,2,±1]. Neither pops off as an item.
  - id: test_carried_cushion_carpet_and_moved
    name: "Test: cushions on a carpet and on a swung plank"
    test_only: true
    assert_at: 120
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",        facing: up,   at: [0, 0, 0] }
    vanilla:
      - { block: "SLIME_BLOCK", at: [0, 1, 0] }
      - { block: "WHITE_CARPET", at: [0, 2, 0] }
      - { block: "OAK_PLANKS", at: [1, 1, 0] }
    activate: { pulse: [1, 0, 0] }
    actions:
      - { tick: 5, do: summon, entity: cushion, rider: pig, at: [0, 2, 0] }   # rests on the carpet
      - { tick: 5, do: summon, entity: cushion, at: [1, 2, 0] }
    expect:
      - { type: mechanism_swung, value: "0,1,0; 0,2,0; 1,1,0", at: [0, 0, 0] }
      - { type: block_type, value: WHITE_CARPET, at: [0, 2, 0] }
      - { type: riding, value: "pig/cushion", at: [0, 2, 0], to: [0, 3, 0] }
      - { type: entity_count, value: "cushion=2", at: [0, 2, -1], to: [0, 2, 1] }
      - { type: entity_count, value: "cushion=0", at: [1, 2, 0] }
      - { type: entity_count, value: "item=0", at: [-3, -1, -3], to: [3, 4, 3] }

  # A cushion whose landing cell is filled (26.3+; SKIPs on older servers): the plank swings round under stone, so
  # the cushion on it can't land on top. It must come back as exactly one item — not teleported into the stone,
  # not lost.
  - id: test_carried_cushion_blocked_drops
    name: "Test: cushion drops when its landing cell is filled"
    test_only: true
    assert_at: 120
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",        facing: up,   at: [0, 0, 0] }
    vanilla:
      - { block: "SLIME_BLOCK", at: [0, 1, 0] }
      - { block: "OAK_PLANKS", at: [1, 1, 0] }
      - { block: "STONE", at: [0, 2, 1] }
      - { block: "STONE", at: [0, 2, -1] }
    activate: { pulse: [1, 0, 0] }
    actions:
      - { tick: 5, do: summon, entity: cushion, at: [1, 2, 0] }
    expect:
      - { type: mechanism_swung, value: "0,1,0; 1,1,0", at: [0, 0, 0] }
      - { type: block_type, value: STONE, at: [0, 2, 1] }
      - { type: block_type, value: STONE, at: [0, 2, -1] }
      - { type: entity_count, value: "cushion=0", at: [-3, -1, -3], to: [3, 4, 3] }
      - { type: entity_count, value: "item=1", at: [-3, -1, -3], to: [3, 4, 3] }

  # A chain hoist broken mid-descent must give back all its chain: a descent reserves its whole budget from
  # storage up front, and breaking the hoist lands the links paid out so far (as blocks) while the dying hoist
  # drops the un-travelled remainder as items — never billed against the storage that already spilled (free
  # chain) nor lost. 16 chains in, motor straight on the Z axle (CW = pay out, ~0.25 block/tick unloaded), so
  # at tick 30 it is a few links down. The STONE only seats the hoist 20 blocks up.
  - id: test_hoist_broken_mid_descent_refunds
    name: "Test: hoist broken mid-descent refunds its chain"
    test_only: true
    assert_at: 60
    blocks:
      - { id: "mech:chain_hoist",    facing: down,  state: idle_z, at: [0, 20, 0], contents: ["IRON_CHAIN x16"] }
      - { id: "mech:redstone_motor", facing: north, at: [0, 20, 1] }
    vanilla:
      - { block: "STONE", at: [0, 0, 0] }
    activate: passive
    actions:
      - { tick: 30, do: break, at: [0, 20, 0] }
    expect:
      - { type: block_type, value: IRON_CHAIN, at: [0, 19, 0] }      # the descent had started…
      - { type: block_type, value: "!IRON_CHAIN", at: [0, 4, 0] }    # …and was cut short of all 16
      - { type: material_total, value: "IRON_CHAIN=16", at: [-4, 0, -4], to: [4, 21, 4] }

  # A lectern's book rides a mechanism: the ceiling rotator turns the lectern above it 90° in place, and it
  # must land still holding the book — not empty, and not with the book dropped.
  - id: test_carried_lectern_book
    name: "Test: lectern keeps its book on a rotator"
    test_only: true
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",        facing: up,   at: [0, 0, 0] }
    vanilla:
      - { block: "LECTERN", at: [0, 1, 0], data: "[facing=north]", contents: [WRITABLE_BOOK] }
    activate: { pulse: [1, 0, 0] }
    expect:
      - { type: mechanism_swung, value: "0,1,0", at: [0, 0, 0] }
      - { type: block_type, value: LECTERN, at: [0, 1, 0] }
      - { type: contents, at: [0, 1, 0], items: [WRITABLE_BOOK] }
      - { type: entity_count, value: "item=0", at: [-3, -1, -3], to: [3, 3, 3] }

  # The placer sets bare blocks, so it must never place an item carrying data — a filled shulker box would
  # land EMPTY (its contents deleted). It pulls both items from the barrel behind it into its own storage; the
  # shulker must stay there while the plain STONE after it is placed (so the skip isn't a stalled placer).
  - id: test_placer_skips_filled_shulker
    name: "Test: placer keeps a filled shulker box"
    test_only: true
    assert_at: 100
    blocks:
      - { id: "mech:redstone_motor", facing: down, at: [0, 3, 0] }   # 2 motors = the placer's demand of 2
      - { id: "mech:redstone_motor", facing: down, at: [0, 2, 0] }
      - { id: "mech:shaft",          facing: down, at: [0, 1, 0] }
      - { id: "mech:placer",         facing: west, at: [0, 0, 0] }   # pulls from [-1,0,0], places into [1,0,0]
    vanilla:
      - { block: "BARREL", at: [-1, 0, 0], data: "[facing=up,open=false]",
          contents: [{ material: SHULKER_BOX, contents: ["DIAMOND x5"] }, STONE] }
    activate: passive
    expect:
      - { type: block_type, value: STONE, at: [1, 0, 0] }
      - { type: contents, at: [0, 0, 0], items: [SHULKER_BOX, "STONE x0"] }

  # A mechanical dispenser (a real DISPENSER, physical_material) carried by a mechanism must land with its
  # contents: capture copies them into the mechanism, and the removal hook must not ALSO spill them (dupe) or
  # the framework wipe them (loss). Unglued, the ceiling rotator carries just the block above it. The
  # dispenser is an omni consumer on the rotator's network, hence two motors.
  - id: test_carried_mech_dispenser_contents
    name: "Test: mechanical dispenser keeps its contents on a rotator"
    test_only: true
    blocks:
      - { id: "mech:redstone_motor",        facing: down, at: [0, -2, 0] }
      - { id: "mech:redstone_motor",        facing: down, at: [0, -1, 0] }
      - { id: "mech:rotator",               facing: up,   at: [0, 0, 0] }
      - { id: "mech:mechanical_dispenser",  facing: down, at: [0, 1, 0], contents: ["ARROW x16", "DIAMOND x3"] }
    activate: { pulse: [1, 0, 0] }
    expect:
      - { type: mechanism_swung, value: "0,1,0", at: [0, 0, 0] }
      - { type: block_type, value: DISPENSER, at: [0, 1, 0] }
      - { type: contents, at: [0, 1, 0], items: ["ARROW x16", "DIAMOND x3"] }
      - { type: entity_count, value: "item=0", at: [-3, -2, -3], to: [3, 3, 3] }

  # Burning a lava bucket gives the empty bucket back: merged into a BUCKET stack in the engine's storage when
  # there is one (left engine), else dropped beside the engine (right) — never deleted, and never parked in an
  # empty slot (which would fill the storage and starve the engine). A floor drill (demand 5, always-on load)
  # makes each engine burn at half rate: the first burn lands around tick 60.
  - id: test_engine_returns_lava_bucket
    name: "Test: engine returns the lava bucket's bucket"
    test_only: true
    assert_at: 140
    blocks:
      - { id: "mech:engine", facing: down, at: [0, 0, 0], contents: [LAVA_BUCKET, BUCKET] }
      - { id: "mech:drill",  facing: down, at: [0, 1, 0] }
      # 6 apart, boxes not touching: the dropped bucket scatters, and at 3 apart it sometimes rolled into
      # the left engine's box (flaky on 26.x).
      - { id: "mech:engine", facing: down, at: [6, 0, 0], contents: [LAVA_BUCKET] }
      - { id: "mech:drill",  facing: down, at: [6, 1, 0] }
    activate: passive
    expect:
      - { type: contents, at: [0, 0, 0], items: ["LAVA_BUCKET x0", "BUCKET x2"] }
      - { type: entity_count, value: "item:BUCKET=0", at: [-2, -1, -2], to: [2, 2, 2] }
      - { type: contents, at: [6, 0, 0], items: ["LAVA_BUCKET x0", "BUCKET x0"] }
      # Wide: the bucket is dropped with the vanilla scatter and was seen 3 blocks off (x=9.2) on purpur.
      - { type: entity_count, value: "item:BUCKET=1", at: [3, -1, -4], to: [12, 2, 4] }

  # Breaking a copper-chest machine must not wipe the chest it is paired with. The water wheel IS a waxed
  # copper chest (physical_material). Its placement unpairs it, but a vanilla chest placed beside it later
  # merges the two into a double chest — and the wheel's removal hook used to clear the COMBINED inventory,
  # deleting the neighbour's contents. The tick-20 `set` is that later merge (facing north, the left half's
  # partner is east of it; same block, so the wheel keeps its tile + identity).
  - id: test_water_wheel_break_keeps_chest
    name: "Test: breaking a water wheel keeps the paired chest's contents"
    test_only: true
    blocks:
      - { id: "mech:water_wheel", facing: north, at: [0, 0, 0] }
    vanilla:
      - { block: "WAXED_COPPER_CHEST", at: [-1, 0, 0], data: "[facing=north,type=left]",
          contents: ["COBBLESTONE x64", "DIAMOND x5"] }
    activate: passive
    actions:
      - { tick: 20, do: set, block: WAXED_COPPER_CHEST, data: "[facing=north,type=right]", at: [0, 0, 0] }
      - { tick: 30, do: break, at: [0, 0, 0] }
    expect:
      - { type: block_type, value: AIR, at: [0, 0, 0] }
      - { type: contents, at: [-1, 0, 0], items: ["COBBLESTONE x64", "DIAMOND x5"] }
      - { type: entity_count, value: "item:COBBLESTONE=0", at: [-3, -1, -3], to: [3, 2, 3] }

  # ── Restart scenarios (make showcase-restart-test) ──────────────────────────────────────────────────────

  # A persisted mechanism survives a crash: lifted and persisted, the world saved (its entities now on disk),
  # then the server halts without disabling plugins. Boot 2 must recover it from those entities + its state
  # file — exactly once, and not also as a block.
  - id: test_restart_crash_persisted_mechanism
    name: "Test: persisted mechanism survives a crash"
    test_only: true
    restart: crash
    assert_at: 60
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 0, 0] }
    actions:
      - { tick: 10, do: persist_mechanism, at: [0, 0, 0] }
      - { tick: 20, do: save, at: [0, 0, 0] }
    expect:
      - { type: mechanism_count, value: "1", at: [-1, -1, -1], to: [1, 1, 1] }
    after_restart:
      - { type: mechanism_count, value: "1", at: [-1, -1, -1], to: [1, 1, 1] }
      - { type: block_type, value: AIR, at: [0, 0, 0] }

  # A persisted mechanism's state file must outlive its disassembly until the world saves: the landed plank is
  # only in memory, the region on disk still holds the parked entities. Deleted at disassembly, a crash here
  # leaves entities without state, the orphan sweep reaps them, and the plank is gone. Kept (and marked
  # "landed"), boot 2 redoes the landing instead of reviving the mechanism: the plank is back, nothing is left.
  - id: test_restart_crash_disassembled_state_kept
    name: "Test: a disassembly a crash undid is redone"
    test_only: true
    restart: crash
    assert_at: 60
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 0, 0] }
    actions:
      - { tick: 10, do: persist_mechanism, at: [0, 0, 0] }
      - { tick: 20, do: save, at: [0, 0, 0] }
      - { tick: 30, do: disassemble_mechanism, at: [0, 0, 0] }
    expect:
      - { type: block_type, value: OAK_PLANKS, at: [0, 0, 0] }   # landed (its state file is now a teardown record)
    after_restart:
      - { type: mechanism_count, value: "0", at: [-1, -1, -1], to: [1, 1, 1] }
      - { type: block_type, value: OAK_PLANKS, at: [0, 0, 0] }

  # The clean counterpart: disassembled, then a normal stop (which saves the landed plank). Boot 2 must find
  # the plank and nothing else — no recovered ghost mechanism, no leftover display or collider entities.
  - id: test_restart_clean_disassembled_no_ghost
    name: "Test: disassembled mechanism leaves no ghost after a clean stop"
    test_only: true
    restart: clean
    assert_at: 60
    vanilla:
      - { block: "OAK_PLANKS", at: [0, 0, 0] }
    actions:
      - { tick: 10, do: persist_mechanism, at: [0, 0, 0] }
      - { tick: 20, do: save, at: [0, 0, 0] }
      - { tick: 30, do: disassemble_mechanism, at: [0, 0, 0] }
    expect:
      - { type: block_type, value: OAK_PLANKS, at: [0, 0, 0] }
    after_restart:
      - { type: block_type, value: OAK_PLANKS, at: [0, 0, 0] }
      - { type: mechanism_count, value: "0", at: [-1, -1, -1], to: [1, 1, 1] }
      - { type: entity_count, value: "block_display=0", at: [-1, -1, -1], to: [1, 1, 1] }
      - { type: entity_count, value: "shulker=0", at: [-1, -1, -1], to: [1, 1, 1] }

  # Engine fuel survives a clean restart: the counter lives in memory and is written to the engine's PDC only
  # on chunk unload / plugin disable — lose that flush and a restart silently empties every engine. Fuelled
  # with 6000 by `activate`, a fan burns well under 1000 of it before the stop.
  - id: test_restart_clean_engine_fuel
    name: "Test: engine fuel survives a clean restart"
    test_only: true
    restart: clean
    blocks:
      - { id: "mech:engine", facing: down, at: [0, 0, 0] }
      - { id: "mech:shaft",  facing: down, at: [0, 1, 0] }
      - { id: "mech:fan",    facing: down, at: [0, 2, 0] }
    activate: { fuel: [0, 0, 0] }
    expect:
      - { type: spinning, at: [0, 2, 0] }
    after_restart:
      - { type: engine_fuel, value: "5000", at: [0, 0, 0] }
      - { type: state, value: running_y, at: [0, 0, 0] }
      - { type: network_powered, at: [0, 1, 0] }
