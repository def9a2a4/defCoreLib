# Demo "showcases": multi-block machines that demonstrate plugin functionality.
# Placed as real, network-joined blocks. `at` is [dx,dy,dz] from the build origin; `facing` is the
# placement (clicked) face — the block's head then points the OPPOSITE way (a wall head faces away
# from the surface it hangs on). This matters for DIRECTIONAL blocks (drill bore, fan blow, millstone
# wall side): write the clicked face, not the direction you want it to point.
# KEY RULE (verified in RotationNetwork): a block connects only to the two neighbours
# ALONG ITS SPIN AXIS — facing down → Y axis (couples up/down); north/south → Z (couples N/S); east/west
# → X (couples E/W). So a power chain must run *along* the shared axis.
#   • millstone is always Y-axis (wall-mounted, powered from directly above/below) regardless of facing.
#   • drill/fan take their axis from facing.
#   • redstone motor is a PASSIVE source (spins by default; redstone DISABLES it) — never pulse it.
#   • engine only produces power once FUELLED (the runner feeds it); idle/static until then.
#   • reverser only flips direction when it is itself redstone-powered.
#
# Blocks may carry an explicit `state` (the corelib:state token, e.g. idle_z, east) — it overrides the
# placement_state_map and is REQUIRED to round-trip floor-mounted axes and pipe facings; exports emit it.
#
# `activate`: passive | { fuel: [x,y,z] } | { pulse: [x,y,z] }.  `expect`: phase-2 assertions.
showcases:
  # ── Full processing line: drill → mill → mill → place (cobblestone into sand) ──
  - id: sand_generator
    name: "Cobblestone → Sand Factory"
    blurb: "A windmill-and-engine gear train drills cobblestone, mills it down through gravel into sand, and a placer sets the sand back down."
    description: >
      A complete production line. A drill chews through the cobblestone in front of it
      (as if fed by a cobblestone generator), and the rubble drops into a hopper and barrel.
      Power comes from two passive-ish sources side by side — a huge windmill and an engine,
      enough combined supply for the whole tower of machines — whose rotation is gathered
      through a clutch and a cluster of gears, then carried down
      vertical shafts to a pair of stacked millstones. The first millstone grinds cobblestone
      into gravel; the second grinds that gravel into sand. A placer at the foot of the column
      takes the finished sand and sets it down as a real block in the world.
    blocks:
      - { id: "mech:gear",           facing: east,  at: [0, 0, 0] }
      - { id: "mech:clutch",         facing: east,  at: [-1, 0, 0] }
      - { id: "mech:gear",           facing: down,  at: [0, 0, -1] }
      - { id: "mech:gear",           facing: north, at: [0, 0, 1] }
      - { id: "mech:engine",         facing: south, at: [0, 0, 2] }
      # Huge windmill (15) + engine (10) = 25 supply vs 17 demand (drill 5 + 2 millstones 10 + placer 2)
      # — a large windmill's 5 left the tower underpowered under the dfed5d0 power tiers.
      - { id: "mech:huge_windmill", facing: north, at: [0, 0, 3] }
      - { id: "mech:drill",          facing: east,  at: [-2, 0, 0] }
      - { id: "mech:gear",           facing: down,  at: [-1, 0, -1] }
      - { id: "mech:shaft",          facing: down,  at: [0, -1, -1] }
      - { id: "mech:gear",           facing: down,  at: [-2, 0, -1] }
      - { id: "mech:shaft",          facing: down,  at: [-1, -1, -1] }
      - { id: "mech:millstone",      facing: west,  at: [-2, -1, -1] }
      - { id: "mech:millstone",      facing: west,  at: [-1, -2, -1] }
      - { id: "mech:shaft",          facing: down,  at: [0, -2, -1] }
      - { id: "mech:placer",         facing: west,  at: [0, -3, -1] }
    vanilla:
      - { block: "LEVER",        at: [-1, 0, 1],   data: "[face=floor,facing=north,powered=true]" }
      - { block: "SMOOTH_STONE", at: [-1, -1, 1] }
      - { block: "BARREL",       at: [-3, -1, -1], data: "[facing=up,open=false]" }
      - { block: "HOPPER",       at: [-3, -1, 0],  data: "[enabled=true,facing=north]" }
      - { block: "COBBLESTONE",  at: [-3, 0, 0] }
      - { block: "BARREL",       at: [-2, -2, -1], data: "[facing=up,open=false]" }
      - { block: "BARREL",       at: [-1, -3, -1], data: "[facing=up,open=false]" }
      - { block: "SAND",         at: [1, -3, -1] }
    activate: passive
    # No expects, and not an oversight to fix blind: `activate: passive` never fuels the engine, so the
    # "25 supply vs 17 demand" arithmetic above doesn't hold at test time (the huge windmill's 15 alone is
    # short of 17) — and the powered lever at [-1,0,1] sits beside the clutch at [-1,0,0], which may
    # disengage it and cut the drill's 5 out of the demand. Which of those wins needs an in-game look;
    # switching to `activate: { fuel: [0, 0, 2] }` would also change what the docs capture shows.
    expect: []

  # ── Engine-powered (fuel source; static until the runner fuels them) ────
  - id: engine_fan
    name: "Engine → Fan"
    blurb: "A fuel-burning engine spins a shaft up into a fan that blows a gust of air."
    description: >
      The engine burns fuel — coal, charcoal, a lava bucket — to produce rotational power, measured in
      Power. That power runs up the shaft (a shaft just transmits rotation along its axis) into
      the fan, which turns it back into motion: a directed gust that pushes entities away from its face.
      The more surplus power on the network, the stronger the push.
    blocks:
      - { id: "mech:engine", facing: down, at: [0, 0, 0] }   # Y axis (couples up)
      - { id: "mech:shaft",  facing: down, at: [0, 1, 0] }
      - { id: "mech:fan",    facing: down, at: [0, 2, 0] }   # floor fan = Y axis
    activate: { fuel: [0, 0, 0] }
    expect:
      - { type: network_powered, at: [0, 1, 0] }
      - { type: spinning, at: [0, 2, 0] }

  - id: engine_millstone
    name: "Engine → Millstone"
    blurb: "A fuel-burning engine drives a vertical shaft down into a millstone that mills items."
    description: >
      A fuelled engine sends power down a vertical shaft into a millstone. The millstone is always a
      Y-axis machine — it draws power from directly above or below — and grinds items fed from an adjacent
      container into new materials according to its recipe set while its wheel spins. Stop feeding the
      engine fuel and the whole column winds down.
    blocks:
      # Millstone is Y-axis (powered from above), so the whole chain is a vertical Y column.
      - { id: "mech:engine",     facing: down,  at: [0, 2, 0] }
      - { id: "mech:shaft",      facing: down,  at: [0, 1, 0] }
      # `facing` is the clicked face → the head points the OPPOSITE way, so `south` mounts the
      # millstone onto the +z block below. (Axis is hardcoded Y regardless of facing.)
      - { id: "mech:millstone", facing: south, at: [0, 0, 0] }
    vanilla:
      # The millstone reads items from the container on its mounting face — a barrel here.
      - { block: "BARREL", at: [0, 0, 1] }
    activate: { fuel: [0, 2, 0] }
    expect:
      - { type: network_powered, at: [0, 1, 0] }
      - { type: spinning, at: [0, 0, 0] }

  # ── Motor-powered (passive: spins by default — do NOT pulse it) ─────────
  - id: redstone_motor_drill
    name: "Motor → Drill"
    blurb: "A bank of five redstone motors powers a drill that bores forward through solid stone."
    description: >
      Motors are passive power sources — they spin on their own (and redstone DISABLES them, rather
      than enabling them) — but each one supplies just a single unit of power, and a drill demands five.
      So five motors sit coupled in a line, their rotation summing along the shared axle before it feeds
      through a clutch into the drill, which bores into whatever block sits in front of its bit, breaking
      it in stages. A clutch passes power straight through like a shaft, but a redstone signal disengages
      it — a quick way to stop the drill without unpowering the motors. Because rotation only couples
      along a block's spin axis, everything sits in one line.
    blocks:
      # Horizontal Z column (all Z axis, coupled along N/S). `facing` is the clicked face → the head
      # points the OPPOSITE way, so the drill is `south` to bore NORTH (−z) into the stone — NOT into
      # its own clutch on the +z side. Motor/clutch direction is irrelevant (Z axis either way).
      # The clutch transmits power like a shaft, but can be switched off with redstone to cut the drill.
      # FIVE motors: each supplies 1 power and the drill demands 5 (rotation-config power tiers) —
      # co-axial in-line sources sum their supply on one network.
      - { id: "mech:redstone_motor", facing: south, at: [0, 0, 2] }
      - { id: "mech:redstone_motor", facing: south, at: [0, 0, 3] }
      - { id: "mech:redstone_motor", facing: south, at: [0, 0, 4] }
      - { id: "mech:redstone_motor", facing: south, at: [0, 0, 5] }
      - { id: "mech:redstone_motor", facing: south, at: [0, 0, 6] }
      - { id: "mech:clutch",    facing: north, at: [0, 0, 1] }
      - { id: "mech:drill",     facing: south, at: [0, 0, 0] }   # bores north (−z) into the stone
    vanilla:
      - { block: "STONE", at: [0, 0, -1] }   # the block the drill chews
    activate: passive
    expect:
      - { type: network_powered, at: [0, 0, 1] }
      - { type: spinning, at: [0, 0, 0] }

  - id: redstone_motor_fan
    name: "Motor → Fan"
    blurb: "A pair of redstone motors spins a shaft up into a fan that blows a gust of air — no fuel needed."
    description: >
      Passive motors spin on their own and drive a shaft up into a fan. Unlike the fuel-burning
      engine, motors need no upkeep — they run continuously until a redstone signal disables them.
      Each motor supplies one unit of power and the fan demands two, so a second motor sits coupled
      below the first on the same vertical axle. The fan turns that rotation into a directed gust
      that pushes entities away from its face.
    blocks:
      # TWO motors: 1 power each vs the fan's demand of 2 — stacked co-axially on the Y axle.
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }
      - { id: "mech:redstone_motor", facing: down, at: [0, 0, 0] }
      - { id: "mech:shaft",     facing: down, at: [0, 1, 0] }
      - { id: "mech:fan",       facing: down, at: [0, 2, 0] }
    activate: passive
    expect:
      - { type: network_powered, at: [0, 1, 0] }
      - { type: spinning, at: [0, 2, 0] }

  - id: redstone_motor_drawbridge
    name: "Motor → Reverser → Drawbridge"
    blurb: "A motor drives a rotator hinge through a lever-switched reverser; a pulse swings the glued panel down like a drawbridge."
    description: >
      The rotator is a hinge: on a redstone pulse it lifts every block glued to it into one moving
      structure and swings it a quarter-turn about its axle — here a 2×2 panel standing on the hinge's
      line, which tips over and lands flat, a drawbridge. (Glue the panel with the Glue Brush; with
      nothing glued, a hinge swings only the single block it is mounted on.) Power reaches it from the
      motor behind, through a reverser: the floor lever beside the reverser is on, so the swing runs the
      reversed direction. This is the mechanism system at work — real blocks are lifted into display
      entities, rotated, and set back down at their new orientation.
    assert_at: 160
    blocks:
      # Z-axis chain: motor → reverser → rotator hinge. The motor sits two blocks BEHIND the hinge
      # so neither the swing pulse (east of the hinge) nor the lever (beside the reverser) can disable it.
      - { id: "mech:redstone_motor", facing: north, at: [0, 0, -2] }
      - { id: "mech:reverser",  facing: north, at: [0, 0, -1] }   # lever beside it → reverses the swing
      # Hinge, Z axis, with the whole panel glued to it.
      - { id: "mech:rotator",   facing: south, at: [0, 0, 0],
          glue: [[0, 0, 1], [0, 1, 1], [0, 0, 2], [0, 1, 2]] }
    vanilla:
      # Drawbridge leaf: a 2×2 vertical panel standing up BEHIND the hinge (+z), in the ZY plane at x=0, its
      # bottom row on the hinge's axle. The swing tips the top row down to lie flat east or west of it.
      - { block: "OAK_PLANKS", at: [0, 0, 1] }
      - { block: "OAK_PLANKS", at: [0, 1, 1] }
      - { block: "OAK_PLANKS", at: [0, 0, 2] }
      - { block: "OAK_PLANKS", at: [0, 1, 2] }
      # Floor lever, switched on, face-adjacent to the reverser only → powers it (reverses direction).
      - { block: "LEVER", at: [-1, 0, -1], data: "[face=floor,facing=north,powered=true]" }
    activate: { pulse: [1, 0, 0] }   # redstone east of the hinge → rising edge → swing (not near the motor)
    expect:
      - { type: mechanism_swung, value: "0,0,1; 0,1,1; 0,0,2; 0,1,2", at: [0, 0, 0] }
      - { type: block_type, value: AIR, at: [0, 1, 1], to: [0, 1, 2] }   # the panel is down…
      - { type: material_total, value: "OAK_PLANKS=4", at: [-1, 0, 1], to: [1, 0, 2] }   # …flat, all four

  - id: redstone_motor_door
    name: "Motor → Rotator Door"
    blurb: "A rotator on top of a door's hinge column swings the whole glued 3×3 door a quarter-turn open."
    description: >
      Set on top of a block, a rotator hinges about the vertical: everything glued to it swings round
      the column beneath it like a door. Here it sits on the top of the door's hinge edge, a column of
      three planks, with the rest of a 3×3 spruce door glued beside it. A redstone pulse swings the door
      a quarter-turn, and the next pulse swings it again — which way is set by the network's spin
      direction. Power comes down the vertical axle from the motors stacked on top of the rotator.
    assert_at: 200
    blocks:
      # Three Y-axis motors stacked above the hinge: swing speed is power over mass, and nine planks on one
      # motor take ~10 s to turn.
      - { id: "mech:redstone_motor", facing: down, at: [0, 6, 0] }
      - { id: "mech:redstone_motor", facing: down, at: [0, 5, 0] }
      - { id: "mech:redstone_motor", facing: down, at: [0, 4, 0] }
      - { id: "mech:rotator",        facing: down, at: [0, 3, 0],    # sits on the hinge column, Y axis
          glue: [[0, 0, 0], [0, 1, 0], [0, 2, 0],
                 [0, 0, 1], [0, 1, 1], [0, 2, 1],
                 [0, 0, 2], [0, 1, 2], [0, 2, 2]] }
    vanilla:
      # The hinge column (x=0, z=0) under the rotator, and the door's two other columns beside it (+z).
      - { block: "SPRUCE_PLANKS", at: [0, 0, 0] }
      - { block: "SPRUCE_PLANKS", at: [0, 1, 0] }
      - { block: "SPRUCE_PLANKS", at: [0, 2, 0] }
      - { block: "SPRUCE_PLANKS", at: [0, 0, 1] }
      - { block: "SPRUCE_PLANKS", at: [0, 1, 1] }
      - { block: "SPRUCE_PLANKS", at: [0, 2, 1] }
      - { block: "SPRUCE_PLANKS", at: [0, 0, 2] }
      - { block: "SPRUCE_PLANKS", at: [0, 1, 2] }
      - { block: "SPRUCE_PLANKS", at: [0, 2, 2] }
    activate: { pulse: [0, 3, -1] }   # behind the rotator, out of the door's sweep and off the motor
    expect:
      - { type: mechanism_swung, value: "0,0,0; 0,1,0; 0,2,0; 0,0,1; 0,1,1; 0,2,1; 0,0,2; 0,1,2; 0,2,2", at: [0, 3, 0] }
      - { type: block_type, value: AIR, at: [0, 0, 1], to: [0, 2, 2] }   # swung away…
      - { type: material_total, value: "SPRUCE_PLANKS=9", at: [-2, 0, 0], to: [2, 2, 0] }   # …to lie along x

  - id: redstone_motor_chassis_drawbridge
    name: "Motor → Chassis Drawbridge"
    blurb: "A chassis block grabs its neighbours by itself: the hinge swings the whole panel down with no glue at all."
    description: >
      A chassis is a casing frame with slime reach: it grabs every movable block touching it (and any
      same-wood chassis beside it), so whatever the hinge swings it drags its neighbours along — no Glue
      Brush needed. Here the hinge is mounted on a row of two oak chassis, and the planks sitting on top
      of them come too: one pulse swings the 2×2 panel down flat, like the glued drawbridge. The build
      stands on stone pillars so the chassis can't reach — and scoop up — the ground.
    assert_at: 160
    blocks:
      - { id: "mech:redstone_motor", facing: north, at: [0, 1, -2] }
      - { id: "mech:shaft",          facing: north, at: [0, 1, -1] }
      - { id: "mech:rotator",        facing: south, at: [0, 1, 0] }    # hinge, Z axis → swings [0,1,1]
      # The panel's bottom row, on the hinge's axle (so it rolls in place); each grabs the plank above it.
      - { id: "mech:chassis_oak",    facing: down, state: idle, at: [0, 1, 1] }
      - { id: "mech:chassis_oak",    facing: down, state: idle, at: [0, 1, 2] }
    vanilla:
      - { block: "STONE", at: [0, 0, -2] }
      - { block: "STONE", at: [0, 0, -1] }
      - { block: "STONE", at: [0, 0, 0] }
      - { block: "OAK_PLANKS", at: [0, 2, 1] }
      - { block: "OAK_PLANKS", at: [0, 2, 2] }
    activate: { pulse: [1, 1, 0] }   # east of the hinge
    expect:
      - { type: mechanism_swung, value: "0,1,1; 0,1,2; 0,2,1; 0,2,2", at: [0, 1, 0] }
      - { type: block_type, value: AIR, at: [0, 2, 1], to: [0, 2, 2] }   # the top row came down…
      - { type: material_total, value: "OAK_PLANKS=2", at: [-1, 1, 1], to: [1, 1, 2] }   # …flat beside the chassis

  - id: redstone_motor_ratchet
    name: "Motor → Ratchets"
    blurb: "Two ratchets on one motor's axle, set opposite ways: one passes the spin on, the other freewheels."
    description: >
      A ratchet is a one-way valve for rotation: it passes power on only while the line turns its
      allowed direction, and freewheels — fully disconnects — when it turns the other way, so nothing
      past it moves and it costs the source nothing. Here one motor drives a shaft out of each side,
      through a ratchet set clockwise on the east and one set counter-clockwise on the west. Both see
      the same spin, so exactly one of the two shafts beyond them turns. Wrench a ratchet to flip it.
    blocks:
      # Order matters: a ratchet placed onto a line that's already turning adopts its direction, so the motor
      # goes down LAST — each ratchet keeps the direction set here.
      - { id: "mech:shaft",   facing: east, at: [3, 0, 0] }
      - { id: "mech:shaft",   facing: east, at: [2, 0, 0] }
      - { id: "mech:ratchet", facing: east, state: idle_cw_x,  at: [1, 0, 0] }
      - { id: "mech:shaft",   facing: west, at: [-3, 0, 0] }
      - { id: "mech:shaft",   facing: west, at: [-2, 0, 0] }
      - { id: "mech:ratchet", facing: west, state: idle_ccw_x, at: [-1, 0, 0] }
      - { id: "mech:redstone_motor", facing: west, at: [0, 0, 0] }   # X-axis source, both faces
    activate: passive
    expect:
      - { type: spinning, at: [3, 0, 0] }                    # the clockwise ratchet's side turns…
      - { type: state, value: idle_x, at: [-3, 0, 0] }       # …the counter-clockwise one freewheels
      - { type: state, value: spinning_cw_x, at: [1, 0, 0] }  # the passing ratchet turns with the line…
      - { type: state, value: idle_ccw_x, at: [-1, 0, 0] }    # …the freewheeling one keeps its setting, still

  - id: redstone_motor_ceiling_rotator
    name: "Motor → Ceiling Rotator"
    blurb: "A rotator hung under a beam turns it — and everything glued to it — a quarter-turn overhead."
    description: >
      A rotator doesn't only sit on the floor: mounted against the underside of a block it hangs from
      it, and turns that block and everything glued to it about the vertical, like a turntable overhead.
      Here a three-block beam is glued to it; a redstone pulse swings the beam a quarter-turn. It's
      still a Y-axis consumer, so power arrives up the vertical axle from the motor below, while the
      swung beam sits on the opposite (mounting) side above. A reverser sits on the axle between them:
      flip the lever beside it and the next swing turns the other way.
    assert_at: 160
    blocks:
      # Vertical (Y) axle: motor → reverser → ceiling hinge; the hinge hangs from the block above it.
      - { id: "mech:redstone_motor", facing: down, at: [0, -2, 0] }
      - { id: "mech:reverser",       facing: down, at: [0, -1, 0] }   # lever beside it → reverses the swing
      - { id: "mech:rotator",   facing: up,   at: [0, 0, 0],    # ceiling hinge (idle_ceiling), Y axis
          glue: [[0, 1, 0], [1, 1, 0], [2, 1, 0]] }
    vanilla:
      # The beam: its first block is the hinge's mounting block, directly above it.
      - { block: "OAK_PLANKS", at: [0, 1, 0] }
      - { block: "OAK_PLANKS", at: [1, 1, 0] }
      - { block: "OAK_PLANKS", at: [2, 1, 0] }
      # Wall lever, switched on, beside the reverser only. It hangs on a post to the west: a floor lever
      # would power the ground block it stands on, which touches the motor and would switch it off.
      - { block: "STONE", at: [-2, -1, 0] }
      - { block: "LEVER", at: [-1, -1, 0], data: "[face=wall,facing=east,powered=true]" }
    activate: { pulse: [1, 0, 0] }   # redstone east of the hinge → rising edge → swing
    expect:
      - { type: mechanism_swung, value: "0,1,0; 1,1,0; 2,1,0", at: [0, 0, 0] }
      - { type: block_type, value: AIR, at: [1, 1, 0], to: [2, 1, 0] }
      - { type: material_total, value: "OAK_PLANKS=3", at: [0, 1, -2], to: [0, 1, 2] }

  # ── Gears: power turning a 90° corner ───────────────────────────────────
  - id: gear_corner
    name: "Gear Corner"
    blurb: "A motor's vertical power meshes through gears to turn a 90° corner and drive a fan sideways."
    description: >
      A shaft only carries rotation straight along its axis; gears turn the corner. Here a pair of
      passive motors (one power unit each — the fan demands two) spins a vertical (Y) gear, which meshes
      with a second gear mounted at 90° (X) beside it — a bevel pair. The horizontal gear then drives a
      fan on its own axis, so power that entered going up leaves going sideways.
    blocks:
      # TWO motors: 1 power each vs the fan's demand of 2 — stacked co-axially on the Y axle.
      - { id: "mech:redstone_motor", facing: down, at: [0, -1, 0] }   # Y source
      - { id: "mech:redstone_motor", facing: down, at: [0, 0, 0] }   # Y source
      - { id: "mech:gear",      facing: down, at: [0, 1, 0] }   # Y gear, driven from below
      - { id: "mech:gear",      facing: west, at: [1, 1, 0] }   # X gear, meshes perpendicular
      - { id: "mech:fan",       facing: west, at: [2, 1, 0] }   # X consumer
    activate: passive
    expect:
      - { type: network_powered, at: [1, 1, 0] }
      - { type: spinning, at: [2, 1, 0] }

  # ── Windmill: passive wind source (wall-mounted → horizontal power) ──────
  - id: windmill_drill
    name: "Windmill → Drill"
    blurb: "A wall-mounted huge windmill spins on the wind and bores a drill straight through solid stone."
    description: >
      Windmills are passive sources — they never need fuel or redstone, they just turn. Mounted on a wall
      the blades spin in a vertical plane, and (unlike a floor windmill) they deliver power horizontally
      along that spin axis. This one drives a shaft into a drill that bores forward through stone. Bigger
      banners mean a bigger windmill and far more power.
    blocks:
      # Wall windmill (spins on Z) feeds a Z shaft directly in front of it, into a drill boring +z.
      - { id: "mech:huge_windmill", facing: south, at: [0, 0, 0] }   # wall_n → Z axis, blades face +z
      - { id: "mech:shaft",         facing: north, at: [0, 0, 1] }
      - { id: "mech:drill",         facing: north, at: [0, 0, 2] }   # head→south → bores +z into stone
    vanilla:
      - { block: "STONE", at: [0, 0, 3] }   # the block the drill chews
    activate: passive
    expect:
      - { type: network_powered, at: [0, 0, 1] }
      - { type: spinning, at: [0, 0, 2] }

  # ── Press: second processing machine (piston bobs under power) ──────────
  - id: redstone_motor_press
    name: "Motor → Press"
    blurb: "A tower of motors drives a vertical shaft into a press whose piston bobs to squeeze a barrel's contents."
    description: >
      The press is a Y-axis machine like the millstone: it takes power from directly above and extracts
      juices, oils and dyes from items in the barrel it mounts on. Passive motors keep its piston
      bobbing without any fuel — each supplies one unit of power against the press's demand of four,
      so four motors stack coupled on the same vertical axle. (This demo shows the motion; a running
      press needs items in the barrel to actually produce anything.)
    blocks:
      # FOUR motors: 1 power each vs the press's demand of 4 — stacked co-axially on the Y axle.
      - { id: "mech:redstone_motor", facing: down,  at: [0, 5, 0] }   # Y source
      - { id: "mech:redstone_motor", facing: down,  at: [0, 4, 0] }   # Y source
      - { id: "mech:redstone_motor", facing: down,  at: [0, 3, 0] }   # Y source
      - { id: "mech:redstone_motor", facing: down,  at: [0, 2, 0] }   # Y source
      - { id: "mech:shaft",     facing: down,  at: [0, 1, 0] }
      - { id: "mech:press",     facing: south, at: [0, 0, 0] }   # Y machine, mounts on +z block
    vanilla:
      - { block: "BARREL", at: [0, 0, 1] }   # container on the press's mounting face
    activate: passive
    expect:
      - { type: network_powered, at: [0, 1, 0] }
      - { type: spinning, at: [0, 0, 0] }

  # ── Water wheel: water-driven source (needs a flowing current) ──────────
  - id: water_wheel_fan
    name: "Water Wheel → Fan"
    blurb: "Falling water turns a paddle wheel, which spins a shaft into a fan that blows a gust of air."
    description: >
      A water wheel is a source powered by moving water — not a still pool, but a real current
      pushing its paddles. A stream falls past its rim and sets it turning, and that rotation runs down a
      shaft into a fan. No fuel, no redstone, just flow.
    blocks:
      - { id: "mech:water_wheel", facing: north, at: [0, 0, 0] }   # Z axle; spins on flow at its rim
      - { id: "mech:shaft",       facing: north, at: [0, 0, 1] }
      - { id: "mech:fan",         facing: north, at: [0, 0, 2] }
    vanilla:
      # Source falls into the wheel's EAST rim [1,0,0] (left air) → a downward current spins the wheel.
      # A stone lip channels it straight down rather than spreading wide. `physics: true` lets it flow.
      - { block: "WATER", at: [1, 1, 0], physics: true }
      - { block: "STONE", at: [2, 1, 0] }
      - { block: "STONE", at: [2, 0, 0] }
      # Glass walls keep the stream to the source cell and the fall beside the wheel, so it can't spread.
      - { block: "GLASS", at: [0, 1, 0] }
      - { block: "GLASS", at: [1, 1, -1] }
      - { block: "GLASS", at: [1, 1, 1] }
      - { block: "GLASS", at: [1, 0, -1] }
      - { block: "GLASS", at: [1, 0, 1] }
    activate: passive
    # Tests disabled: the water never flows, so the wheel doesn't spin and the network
    # never powers up. Re-enable these once flowing-water source works.
    # expect:
    #   - { type: spinning, at: [0, 0, 0] }
    #   - { type: network_powered, at: [0, 0, 1] }

  # ── Sampler: two passive sources feeding a gear corner ──────────────────
  - id: icon_machine
    name: "Water Wheel & Windmill Gear Corner"
    blurb: "A water wheel and a windmill each drive a shaft into a pair of corner-meshed gears."
    description: >
      Two passive generators meeting at a gear corner. The water wheel spins by default and
      sends rotation west along a shaft; the windmill does the same to the north. Each shaft
      carries its rotation into a gear, and the two gears mesh perpendicular at the corner, so
      both sources turn the same coupled pair. A compact sampler of the rotation system —
      two power sources, shafts, and a gear corner in a single build.
    blocks:
      - { id: "mech:windmill",    facing: south, at: [0, 0, -2] }
      - { id: "mech:shaft",       facing: north, at: [0, 0, -1] }
      - { id: "mech:gear",        facing: south, at: [0, 0, 0] }    # Z axis
      - { id: "mech:gear",        facing: west,  at: [1, 0, 0] }    # X axis, meshes the corner
      - { id: "mech:shaft",       facing: west,  at: [2, 0, 0] }
      - { id: "mech:water_wheel", facing: east,  at: [3, 0, 0] }
    vanilla:
      # Water around the wheel: a source on top, running off its south side and down past its rim.
      - { block: "WATER", at: [3, 0, 1], data: "[level=8]", physics: true }
      - { block: "WATER", at: [3, 1, 0], data: "[level=0]", physics: true }
      - { block: "WATER", at: [3, 1, 1], data: "[level=1]", physics: true }
      # Glass walls dam it in (the export's barriers would never render), so it can't spread over the build.
      - { block: "GLASS", at: [2, 1, 0] }
      - { block: "GLASS", at: [4, 1, 0] }
      - { block: "GLASS", at: [3, 1, -1] }
      - { block: "GLASS", at: [2, 1, 1] }
      - { block: "GLASS", at: [4, 1, 1] }
      - { block: "GLASS", at: [3, 1, 2] }
      - { block: "GLASS", at: [2, 0, 1] }
      - { block: "GLASS", at: [4, 0, 1] }
      - { block: "GLASS", at: [3, 0, 2] }
    activate: passive
    # Asserts the windmill half only. The windmill is a passive source (no water, fuel or redstone
    # needed) and nothing on this network draws power, so it is powered on the windmill's 1 alone and the
    # far shaft proves that power crossed the bevel corner. The water wheel is deliberately NOT asserted:
    # flowing-water power is unreliable in the test window (see water_wheel_fan). It cannot jam the
    # network either way — only stored-direction sources are compared, and the windmill stores none.
    expect:
      - { type: network_powered, at: [2, 0, 0] }
      - { type: spinning, at: [2, 0, 0] }

  # ── Mechanical piston: rotation slides a rod; sticky head shoves the payload ──
  - id: double_extender_piston
    name: "Motor → Reverser → Mechanical Piston"
    blurb: "A motor drives a mechanical piston through a reverser; two poles give it a two-block reach that shoves an oak log."
    description: >
      The mechanical piston is a rotation-powered ram. A passive motor feeds power through a
      reverser and a shaft into the piston core; the core doesn't care which side the power
      comes from — it draws from whichever shaft sits against it. Clockwise spin slides the rod
      out and counter-clockwise pulls it back, and the reach is set by how many poles stack
      behind the core: two here, so it throws two blocks (a "double" reach). The sticky head
      carries the oak log in front of it along for the ride. A floor lever powers the reverser to
      flip the spin direction and switch the stroke between extend and retract; it is shown here in
      the off position, so the rod is driving out.
    blocks:
      - { id: "mech:redstone_motor", facing: west,  at: [-1, 0, 0] }   # passive X source
      - { id: "mech:reverser",       facing: west,  at: [0, 0, 0] }    # lever-driven direction flip
      - { id: "mech:shaft",          facing: east,  at: [1, 0, 0] }    # X-axis bridge
      - { id: "mech:piston_core",    facing: south, at: [2, 0, 0] }    # forward = north
      - { id: "mech:piston_head",    facing: south, at: [2, 0, -1] }   # front (sticky) head
      - { id: "mech:piston_pole",    facing: north, at: [2, 0, 1] }    # back poles → reach 2
      - { id: "mech:piston_pole",    facing: north, at: [2, 0, 2] }
    vanilla:
      # Shown OFF, so the reverser doesn't flip and the core stays CW = extend. With it on the core
      # resolves CCW, and CCW takes its reach from frontPoles — which is 0 here (the front run is just
      # the head), so the piston can never stroke at all. See the expect note below.
      - { block: "LEVER",   at: [0, 0, -1], data: "[face=floor,facing=south,powered=false]" }
      - { block: "OAK_LOG", at: [2, 0, -2], data: "[axis=y]" }   # payload the head pushes
    activate: passive
    expect:
      # piston_stroked is a COUNTER, not a live read: the stroke assembles a mechanism and tears it down
      # again, so by assert time the core is idle whether or not it ever ran.
      #
      # This one is direction-sensitive, and the direction comes from the lever above. maybeTrigger
      # takes `reserve = cw ? backPoles : frontPoles`, and detectLine picks `forward` as the face whose
      # run ends in a head — NORTH here — so frontPoles = 0 and backPoles = 2. On CCW the reserve is 0,
      # clearForAll(max=0) returns 0, and the `if (r > 0)` guard never fires on any tick. So this
      # assertion only holds with the reverser unpowered. Don't "fix" a failure here by widening the
      # tick window; check the lever first.
      - { type: network_powered, at: [1, 0, 0] }
      - { type: piston_stroked, at: [2, 0, 0] }

  - id: piston_slime_wall
    name: "Motor → Mechanical Piston → Slime Wall"
    blurb: "A mechanical piston shoves a whole wall: the slime blocks on its head bond the planks around them."
    description: >
      A mechanical piston's head is sticky — it carries the block in front of it — and when that block is
      slime, the slime grabs every movable block touching it, and any slime it grabs does the same. So a
      column of two slime blocks in the middle of a 3×2 wall turns the whole wall into the piston's load:
      the two poles behind the core give a reach of two, and the wall travels two blocks out. The machine
      stands on stone so the slime can't reach — and drag along — the ground.
    assert_at: 200
    blocks:
      - { id: "mech:redstone_motor", facing: west,  at: [0, 1, 0] }    # passive X source
      - { id: "mech:shaft",          facing: east,  at: [1, 1, 0] }
      - { id: "mech:piston_core",    facing: south, at: [2, 1, 0] }    # forward = north
      - { id: "mech:piston_head",    facing: south, at: [2, 1, -1] }   # sticky front head
      - { id: "mech:piston_pole",    facing: north, at: [2, 1, 1] }    # back poles → reach 2
      - { id: "mech:piston_pole",    facing: north, at: [2, 1, 2] }
    vanilla:
      # Stone under the machine only — never under the wall, or the slime would grab the ground.
      - { block: "STONE", at: [0, 0, 0] }
      - { block: "STONE", at: [1, 0, 0] }
      - { block: "STONE", at: [2, 0, -1] }
      - { block: "STONE", at: [2, 0, 0] }
      - { block: "STONE", at: [2, 0, 1] }
      - { block: "STONE", at: [2, 0, 2] }
      # The wall, one block in front of the head: slime down the middle, planks either side.
      - { block: "SLIME_BLOCK", at: [2, 1, -2] }
      - { block: "SLIME_BLOCK", at: [2, 2, -2] }
      - { block: "OAK_PLANKS",  at: [1, 1, -2] }
      - { block: "OAK_PLANKS",  at: [3, 1, -2] }
      - { block: "OAK_PLANKS",  at: [1, 2, -2] }
      - { block: "OAK_PLANKS",  at: [3, 2, -2] }
    activate: passive
    expect:
      - { type: piston_stroked, at: [2, 1, 0] }
      # The wall left its cells — all but [2,1,-2], where the pole that slides out of the core now fills the rod.
      - { type: block_type, value: AIR, at: [1, 1, -2], to: [1, 2, -2] }
      - { type: block_type, value: AIR, at: [3, 1, -2], to: [3, 2, -2] }
      - { type: block_type, value: AIR, at: [2, 2, -2] }
      - { type: block_type, value: "!AIR", at: [2, 1, -2] }
      - { type: material_total, value: "OAK_PLANKS=4", at: [1, 1, -4], to: [3, 2, -4] }   # …and stands two out
      - { type: block_type, value: SLIME_BLOCK, at: [2, 1, -4], to: [2, 2, -4] }

  # ── Chain pulleys: power jumps a gap by chain, only around a CLOSED loop ────
  - id: chain_pulley_relay
    name: "Windmill → Chain Pulleys → Fan"
    blurb: "Three chain-linked pulleys form a closed loop that carries a windmill's power across two gaps to spin a fan."
    description: >
      A chain pulley jumps rotational power across a gap with no shaft between the two ends —
      link one to another with a chain and, once the links close into a loop, power flows all the
      way around; an open chain renders but carries nothing. Here a windmill feeds the first
      pulley directly below it, that pulley's chain reaches a second, the second's chain reaches a
      third, and the third's chain closes the loop back to the first. A gear and fan sit above the
      third pulley, drawing off the loop's power just like they would from an ordinary shaft. Each
      live chain link also costs a little power of its own (more for a longer span), so a loop this
      size needs a real source, not just a redstone motor.
    blocks:
      - { id: "mech:large_windmill", facing: down, at: [0, -1, 0] }   # passive Y source, 5 power
      - { id: "mech:chain_pulley",   facing: down, at: [0, 0, 0], link: [4, 0, 0] }
      - { id: "mech:chain_pulley",   facing: down, at: [4, 0, 0], link: [4, 0, 3] }
      - { id: "mech:chain_pulley",   facing: down, at: [4, 0, 3], link: [0, 0, 0] }   # closes the loop
      - { id: "mech:gear",           facing: down, at: [4, 1, 3] }   # Y axis, driven from the pulley below
      - { id: "mech:fan",            facing: down, at: [4, 2, 3] }
    activate: passive
    expect:
      - { type: network_powered, at: [4, 0, 3] }
      - { type: spinning, at: [4, 2, 3] }

  # ── Chain hoist: rotation reels a hanging load up its chain ─────────────
  - id: chain_hoist
    name: "Motor → Chain Hoist"
    blurb: "A chain hoist reels its chain in and lifts the block hanging off the end, swallowing each link as it rises."
    description: >
      A chain hoist turns rotation into lifting. Its chain hangs straight down, and whatever block sits
      at the bottom of the chain is the load: turning one way reels the chain in and the load rises up
      to the hoist, turning the other way pays it back out and lowers it. Here a motor drives the hoist
      through a pair of meshed gears — a gear mesh reverses the spin, which is the direction that reels
      in — and a plank hanging three links down rides up to just under the hoist.
    blocks:
      # Z axle: motor [1,4,2] → gear [1,4,1] ⇄ gear [0,4,1] → hoist [0,4,0] (the same-axis mesh reverses → reel in).
      - { id: "mech:chain_hoist",    facing: down,  state: idle_z, at: [0, 4, 0] }
      - { id: "mech:gear",           facing: north, at: [0, 4, 1] }
      - { id: "mech:gear",           facing: north, at: [1, 4, 1] }
      - { id: "mech:redstone_motor", facing: north, at: [1, 4, 2] }
    vanilla:
      - { block: "IRON_CHAIN", at: [0, 3, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 2, 0], data: "[axis=y]" }
      - { block: "IRON_CHAIN", at: [0, 1, 0], data: "[axis=y]" }
      - { block: "OAK_PLANKS", at: [0, 0, 0] }   # the load
    activate: passive
    expect:
      - { type: hoist_moved, at: [0, 4, 0] }
      - { type: block_type, value: OAK_PLANKS, at: [0, 3, 0] }        # the load rose to just under the hoist
      - { type: block_type, value: AIR, at: [0, 0, 0], to: [0, 2, 0] } # every link swallowed on the way

  # ── Steam sieve: water wheels feed a boiler and a wet sieve; steam drives the sieve ──
  # Exported from a live build with ShowcaseExporter; water restored by hand (the glue-based
  # exporter can't capture fluids).
  - id: steam_sieve
    name: "Steam Sieve"
    blurb: "Water wheels drive pumps that feed a boiler and a sieve; the steam stack above works the sieve through an overhead gear bridge."
    description: >
      The full water-and-steam production chain. Three water wheels ride a stone-walled
      stream and gear their rotation west through a redstone dynamo into a pair of pumps:
      one pump lifts water through copper pipes into the boiler, the other feeds the sieve's
      supply line. A burner under the boiler turns that water into steam, and the steam
      piston on top drives the roof shaft run — north along the top and down an overhead
      gear bridge into the sieve, which shakes its contents down into barrels. A clutch
      branch south of the stack, gated by a redstone torch, ties the roof run into the pump
      train, and the dynamo's output feeds a comparator circuit with a digital power readout.
      An engine on the wheel axle stands by as backup power, plumbed to a fuel barrel.
    blocks:
      # Steam stack: burner heats the boiler; the steam piston on top is the power head.
      - { id: "mech:burner",       facing: down, state: "lit", at: [0, -2, 0] }
      - { id: "mech:boiler",       facing: down, state: "idle", at: [0, -1, 0] }
      - { id: "mech:steam_piston", facing: down, state: "running_z", at: [0, 0, 0] }
      # Roof shaft run north from the stack, over the gear bridge, down into the sieve.
      - { id: "mech:shaft", facing: south, state: "spinning_z", at: [0, 0, -1] }
      - { id: "mech:shaft", facing: down,  state: "spinning_z", at: [0, 0, -2] }
      - { id: "mech:shaft", facing: down,  state: "spinning_z", at: [0, 0, -3] }
      - { id: "mech:shaft", facing: north, state: "spinning_z", at: [0, 0, -4] }
      - { id: "mech:gear",  facing: south, state: "spinning_south_z", at: [0, 0, -5] }
      - { id: "mech:gear",  facing: down,  state: "spinning_y", at: [0, 1, -5] }
      - { id: "mech:gear",  facing: down,  state: "spinning_y", at: [1, 1, -5] }
      - { id: "mech:gear",  facing: down,  state: "spinning_y", at: [2, 1, -5] }
      - { id: "mech:shaft", facing: down,  state: "spinning_y", at: [2, 0, -5] }
      - { id: "mech:sieve", facing: north, state: "spinning", at: [2, -1, -5] }
      # Clutch branch south of the stack (redstone torch below gates it), dropping to the pump train.
      - { id: "mech:shaft",  facing: north, state: "spinning_z", at: [0, 0, 1] }
      - { id: "mech:clutch", facing: north, state: "spinning_z", at: [0, 0, 2] }
      - { id: "mech:gear",   facing: north, state: "spinning_z", at: [0, 0, 3] }
      - { id: "mech:gear",   facing: east,  state: "spinning_east_x", at: [1, 0, 3] }
      - { id: "mech:gear",   facing: down,  state: "spinning_y", at: [2, 0, 3] }
      - { id: "mech:gear",   facing: down,  state: "spinning_y", at: [2, -1, 3] }
      - { id: "mech:gear",   facing: down,  state: "spinning_y", at: [2, -1, 2] }
      # Water wheels in the walled stream, geared west through the dynamo into the pumps.
      - { id: "mech:water_wheel",     facing: down,  state: "spinning_z", at: [5, -2, 0] }
      - { id: "mech:water_wheel",     facing: down,  state: "spinning_z", at: [5, -2, -1] }
      - { id: "mech:water_wheel",     facing: down,  state: "spinning_z", at: [5, -2, -2] }
      - { id: "mech:shaft",           facing: north, state: "spinning_z", at: [5, -2, 1] }
      - { id: "mech:gear",            facing: north, state: "spinning_z", at: [5, -2, 2] }
      - { id: "mech:engine",          facing: south, state: "running_z", at: [5, -2, 3] }   # backup power on the wheel axle
      - { id: "mech:gear",            facing: east,  state: "spinning_east_x", at: [4, -2, 2] }
      - { id: "mech:shaft",           facing: down,  state: "spinning_x", at: [3, -2, 2] }
      - { id: "mech:gear",            facing: east,  state: "spinning_east_x", at: [2, -2, 2] }
      - { id: "mech:redstone_dynamo", facing: down,  state: "idle", at: [1, -2, 2] }
      - { id: "mech:gear",            facing: south, state: "spinning_south_z", at: [2, -2, 1] }
      # Pumps: [2,-2,0] lifts water west into the boiler; [2,-2,-2] feeds the sieve line.
      - { id: "mech:pump",  facing: down, state: "spinning_z", at: [2, -2, 0] }
      - { id: "mech:shaft", facing: down, state: "spinning_z", at: [2, -2, -1] }
      - { id: "mech:pump",  facing: down, state: "spinning_z", at: [2, -2, -2] }
      # Pipes: boiler feed, sieve feed, and the engine's fuel line from the barrel.
      - { id: "pipes:copper_pipe",          facing: east,  state: "west", at: [1, -1, 0] }
      - { id: "pipes:copper_corner_pipe",   facing: west,  state: "west", at: [2, -1, 0] }
      - { id: "pipes:copper_corner_pipe",   facing: north, state: "north", at: [2, -1, -2] }
      - { id: "pipes:copper_pipe",          facing: south, state: "north", at: [2, -1, -3] }
      - { id: "pipes:copper_pipe",          facing: south, state: "north", at: [2, -1, -4] }
      - { id: "pipes:oxidized_copper_pipe", facing: south, state: "north", at: [5, -2, 4] }
      # Dynamo power readout.
      - { id: "redstonedisplays:digital_indicator", facing: east, at: [-1, -2, 5] }
    vanilla:
      # Clutch gate torch + dynamo readout circuit into the target block and digital indicator.
      - { block: "REDSTONE_TORCH", at: [0, -1, 2], data: "[lit=false]" }
      - { block: "BARREL", at: [4, -1, 5], data: "[facing=up,open=false]" }
      - { block: "SMOOTH_STONE", at: [0, -2, 2] }
      - { block: "REPEATER", at: [0, -2, 3], data: "[delay=1,facing=south,locked=false,powered=true]" }
      - { block: "REDSTONE_WIRE", at: [0, -2, 4], data: "[east=side,north=side,power=14,south=side,west=none]" }
      - { block: "TARGET", at: [0, -2, 5], data: "[power=0]" }
      - { block: "COMPARATOR", at: [1, -2, 3], data: "[facing=north,mode=compare,powered=true]" }
      - { block: "REDSTONE_WIRE", at: [1, -2, 4], data: "[east=none,north=side,power=15,south=side,west=side]" }
      - { block: "REDSTONE_WIRE", at: [1, -2, 5], data: "[east=side,north=side,power=14,south=none,west=side]" }
      - { block: "REPEATER", at: [2, -2, 5], data: "[delay=1,facing=west,locked=false,powered=true]" }
      - { block: "REDSTONE_WIRE", at: [3, -2, 5], data: "[east=side,north=none,power=15,south=none,west=side]" }
      - { block: "HOPPER", at: [4, -2, 5], data: "[enabled=false,facing=east]" }
      # Engine fuel barrel and sieve output barrels.
      - { block: "BARREL", at: [2, -1, -6], data: "[facing=south,open=false]" }
      - { block: "SMOOTH_STONE", at: [2, -2, -6] }
      - { block: "BARREL", at: [2, -2, -5], data: "[facing=up,open=false]" }
      - { block: "BARREL", at: [5, -2, 5], data: "[facing=up,open=false]" }
      # Stream water, hand-placed (the glue exporter can't capture fluids): sources in the walled channel spill west over the wheel rims; `physics: true` lets them flow during capture.
      - { block: "WATER", at: [6, -1, 0], physics: true }
      - { block: "WATER", at: [6, -1, -1], physics: true }
      - { block: "WATER", at: [6, -1, -2], physics: true }
      # Pump supply pool: sources filling the 3×3 sunken basin under both pumps.
