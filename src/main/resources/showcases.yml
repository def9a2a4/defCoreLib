  # ── Vertical tower crane: motor → shaft column → rotator → boom → chain hoist ──
  - id: crane
    name: "Crane"
    blurb: "A working tower crane: a redstone motor drives a shaft column up through a gearbox and a ceiling rotator to a chain hoist that raises and lowers its load."
    description: >
      A vertical crane assembled entirely from the mechanism set. At the base, stacked redstone
      motors feed a reverser and a long vertical shaft column running up through the stone-brick-and-
      spruce tower. Near the top the power turns a corner through a bank of gears and an acacia
      gearbox, then a ceiling-mounted rotator hands it off to the horizontal boom. Out along the
      copper-clad arm, gearboxes carry the drive to a chain hoist whose iron chain raises and lowers
      the load. Levers, repeaters and redstone torches on the control wall gate the motors so the arm
      can be started, stopped and reversed.
    images:
      - "readmes/assets/mech/crane.png"
      - "readmes/assets/mech/crane-panel.png"
    blocks:
      - { id: "mech:shaft", facing: down, state: idle_y, at: [0, 0, 0] }
      - { id: "mech:shaft", facing: north, state: idle_z, at: [0, 1, 2] }
      - { id: "mech:shaft", facing: south, state: idle_z, at: [0, 1, 3] }
      - { id: "mech:shaft", facing: south, state: idle_z, at: [0, 1, 4] }
      - { id: "mech:shaft", facing: south, state: idle_z, at: [0, 1, 5] }
      - { id: "mech:shaft", facing: south, state: idle_z, at: [0, 1, 6] }
      - { id: "mech:shaft", facing: south, state: idle_z, at: [0, 1, 7] }
