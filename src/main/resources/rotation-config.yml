max-network-size: 256
# Max blocks a mechanism structure (door / drawbridge / minecart) can grab.
# Hitting the cap logs a warning + shows smoke at the anchor (no longer silent).
max-structure-size: 256

# Emit dynamic light from light-emitting blocks carried by a moving mechanism (torch, glowstone,
# sea lantern, …), using each block's vanilla light level, via the optional DynLight plugin
# (https://github.com/def9a2a4/dynlight). Purely a scoreboard-tag integration — no dependency;
# inert when DynLight is absent. Set false to never tag mechanism blocks.
dynamic-lights: true

# "Glue": author-controlled block selection for doors/rotators (replaces same-material flood-fill).
glue:
  # Cap on a glued selection. Independent of max-structure-size and deliberately much larger: a
  # vehicle-sized anchor (a BlockShips ship, own limit 1000 blocks) needs to glue extras across a
  # whole hull, while max-structure-size bounds a door or drawbridge.
  max-size: 1024
  # The glue item itself is declared in corelib-items.yml (corelib:glue_item, SLIME_BALL).
  outline-interval: 5     # ticks between particle-outline refreshes during authoring
  session-timeout: 2400   # ticks of inactivity before an authoring session auto-closes

drill:
  tick-interval: 4
  break-stages: 10
  blacklist:
    - BEDROCK
    - SPAWNER
    - MOVING_PISTON
    - REINFORCED_DEEPSLATE

millstone:
  tick-interval: 20   # fixed grind cycle length, in ticks
  max-batch: 8        # cap on items ground per cycle (batch scales with surplus power)

fan:
  tick-interval: 2    # ticks between pushes (frequent = continuous force)
  range: 5            # fixed beam length, in blocks
  min-push: 0.12      # per-tick push velocity when powered with no surplus power
  max-push: 0.5       # cap on per-tick push velocity
  push-per-power: 0.08 # extra push velocity per surplus power

mechanical-dispenser:
  power-cap: 10         # network power above this adds no more boost ("over 10 does nothing")
  min-boost: 0.4        # extra launch velocity (blocks/tick) at minimum power
  boost-per-power: 0.2  # extra launch velocity per unit of network power (reaches max-boost near 10)
  max-boost: 2.0        # cap for arrows/items (arrow ~1.1 b/t base -> ~3.1 b/t at max power)
  tnt-max-boost: 1.5    # separate cap for thrown primed TNT (forward throw)
  min-straightness: 0.8 # spread reduction at minimum power (1.0 = perfectly straight; dead straight at cap)

press:
  tick-interval: 20   # fixed press cycle length, in ticks
  max-batch: 8        # cap on items pressed per cycle (batch scales with surplus power)

sieve:
  tick-interval: 40   # fixed panning cycle length, in ticks (slower than mill/press on purpose)
  max-batch: 1        # one item panned per cycle — surplus power does not speed it up
  tank-units: 4       # water tank capacity, in buckets (pipe-fillable or bucket right-click)
  water-per-cycles: 16 # pans per bucket of water; a dry sieve idles

pump:
  tick-interval: 40   # ticks per pump cycle (one whole-bucket unit moved per cycle)
  # Body-top raise when a horizontal corner pipe sits above: top goes 1.0015 → 1.2 (rel.
  # pump floor), where a vertical pipe under a corner ends (pipes display.yml
  # corner-pipe.up: -0.3; elbow bottom at 1.225). Re-derive if pipes re-tunes those.
  stretch-to-corner: 0.1985

steam:
  boiler-tank-units: 8      # boiler water tank capacity, in buckets
  water-interval-ticks: 1200 # running time per boiler water unit (~60 s)

placer:
  tick-interval: 20   # ticks between placements (one block placed per cycle)

chain-pulley:
  max-distance: 32    # max distance (blocks) between two linked chain pulleys

piston:
  max-step: 0.25      # mechanical piston (+ chain hoist) cap on per-tick slide velocity (blocks/tick)

redstone_dynamo:
  tick-interval: 10       # ticks between comparator-output refreshes
  default-mode: TOTAL     # TOTAL | USED | UNUSED — which network quantity to report
  default-scaling: CLAMP  # CLAMP | MOD15 | DIV15 — how to map the value into a 0-15 signal

fuel:
  COAL: 16
  CHARCOAL: 12
  COAL_BLOCK: 144    # 16 * 9
  LAVA_BUCKET: 100
  BLAZE_ROD: 20
  STICK: 1
  # Also: all *_LOG/*_WOOD/*_STEM/*_HYPHAE → 8, all *_PLANKS → 3
  # (registered dynamically via Material.values() scan)

power:
  windmill: 1
  large_windmill: 5
  huge_windmill: 15
  water_wheel: 2
  engine: 10
  steam_piston: 20
  redstone_motor: 1
  drill: 5
  millstone: 5
  # 2, not 10. A fan is the entry tier of BlockShips' ship propulsion as well as an entity blower, and
  # BlockShips rates it at 10 thrust against the propeller's 32. At 10 power it cost the SAME as a large
  # propeller (100 thrust) and more than a propeller (32 thrust for 5) — strictly dominated, with no
  # build in which it was ever the right block. At 2 it is worse per block and better per power, which
  # is what an entry tier should be. Ship thrust lives in BlockShips' custom-ships.stats.thrust; these
  # two tables are one balance surface split across two repos, so change them together.
  fan: 2
  press: 4
  sieve: 10
  pump: 4
  placer: 2
  suction_hopper: 3
  mechanical_dispenser: 1   # light constant demand — any powered network (supply >= 1) activates the launcher
  piston_core: 1   # base rotational demand of a mechanical piston core (speed scales with surplus above this)
  chain_hoist: 1   # base rotational demand of a chain hoist (lift speed scales with surplus above this)
  # Ship propulsion. The propellers are consumers: they draw this and produce no power. The thruster
  # has no entry — it burns fuel and never touches the rotation network.
  propeller: 5
  large_propeller: 10
  huge_propeller: 20
  reaction_wheel: 1

# How each rotation block behaves while assembled into a moving mechanism (minecart, door,
# drawbridge). Its supply/demand comes from the `power:` map above — not repeated here.
#   kind:      transmitter — passes power along
#              consumer    — draws power and works at its live world position
#              engine      — supplies while burning fuel from its own travelling inventory
#              constant_source — always supplies while assembled
#              none        — remove a built-in entry (block ignored on mechanisms)
#   axis:      state (default) — spin axis parsed from the captured state name
#              y      — always driven from a shaft on top
#              facing — spin axis follows the block's facing
#              omni   — draws from the first aligned neighbor on any non-mounted face
#   gear_like: meshes with adjacent gears (counter-rotation, bevels)
#   gearbox:   omnidirectional hub — passes power on all six faces; spin-direction firewall (no CW/CCW across it)
#   blows_outward:    the machine acts AWAY from its mount, so a floor-mounted one aims UP (a fan
#                     blows upward off the floor). Affects the reported actuation direction only.
#   mech_power_scale: multiplier on this block's SUPPLY while riding, and only supply — the same
#                     `power:` value also feeds demand, so scaling the raw number would quietly make
#                     consumers cheaper aboard too. Rounded UP, so a tier-1 source never falls to 0.
# Notes: world redstone can't reach a block riding a mechanism, so the reverser/clutch pass
# through unlocked, and the (inverted) redstone motor runs as a constant source. The water
# wheel can't check for water while moving, so it only transmits.
mechanism:
  shaft:           { kind: transmitter }
  gear:            { kind: transmitter, gear_like: true }
  # Gearbox — one per casing wood (all behave identically; see the `gearbox:` flag above).
  gearbox_oak:      { kind: transmitter, gearbox: true }
  gearbox_acacia:   { kind: transmitter, gearbox: true }
  gearbox_bamboo:   { kind: transmitter, gearbox: true }
  gearbox_birch:    { kind: transmitter, gearbox: true }
  gearbox_cherry:   { kind: transmitter, gearbox: true }
  gearbox_crimson:  { kind: transmitter, gearbox: true }
  gearbox_dark_oak: { kind: transmitter, gearbox: true }
  gearbox_jungle:   { kind: transmitter, gearbox: true }
  gearbox_mangrove: { kind: transmitter, gearbox: true }
  gearbox_pale_oak: { kind: transmitter, gearbox: true }
  gearbox_spruce:   { kind: transmitter, gearbox: true }
  gearbox_warped:   { kind: transmitter, gearbox: true }
  reverser:        { kind: transmitter }
  clutch:          { kind: transmitter }
  chain_pulley:    { kind: transmitter }
  redstone_dynamo: { kind: transmitter }
  water_wheel:     { kind: transmitter }
  engine:          { kind: engine }
  redstone_motor:  { kind: constant_source }
  # Windmills supply HALF aboard a mechanism. They are constant sources with no fuel and no wind
  # check, so at full strength a wall of them makes a flying ship free to run forever and the
  # fuel-burning thruster pointless to build. Static-world windmills are unaffected.
  windmill:        { kind: constant_source, mech_power_scale: 0.5 }
  large_windmill:  { kind: constant_source, mech_power_scale: 0.5 }
  huge_windmill:   { kind: constant_source, mech_power_scale: 0.5 }
  drill:           { kind: consumer }
  millstone:       { kind: consumer, axis: y }
  press:           { kind: consumer, axis: y }
  sieve:           { kind: consumer, axis: y }
  placer:          { kind: consumer, axis: y }
  fan:             { kind: consumer, axis: facing, blows_outward: true }
  # Ship propulsion. Propellers act away from their mount like a fan, so a floor one pushes upward.
  # The thruster rides as a ZERO-POWER engine: that gives it fuel burning and the running_/idle_ skin
  # swap for free, while supplying nothing to the network — which is exactly what it should do.
  propeller:       { kind: consumer, axis: facing, blows_outward: true }
  large_propeller: { kind: consumer, axis: facing, blows_outward: true }
  huge_propeller:  { kind: consumer, axis: facing, blows_outward: true }
  reaction_wheel:  { kind: consumer, axis: y }
  thruster:        { kind: engine }
  suction_hopper:  { kind: consumer, axis: omni }
