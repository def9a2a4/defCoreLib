# Per-block INERTIAL mass for mechanisms (always >= 0). Heavier total mass => the mechanism moves
# slower (rotator swing / hoist lift / piston extend), and (later) lowers its power-to-mass ratio in
# the ship-stats system.
#
# This is NOT buoyancy. Buoyancy is a separate SIGNED density scale owned by BlockShips. This table is
# seeded from BlockShips blocks.yml `weight`, but every value is clamped to >= 0 (mirroring BlockShips'
# own `mass = Σ max(0, weight)` rule). Buoyant-but-solid blocks (glowstone/beacon/…), which have a
# NEGATIVE buoyancy weight, are given a small POSITIVE inertial mass here rather than zero.
#
# Keys: a material name (STONE), a #block-tag (#slabs), or a *wildcard (*_copper_chain). Overlapping
# keys resolve MOST-SPECIFIC-WINS: #tags apply first, then *wildcards, then exact material names last,
# so a specific material always overrides a wildcard/tag (e.g. iron_door=3 beats *_door=2).
#
# Reserved top-level keys:
#   default: <n>        fallback mass for any material not listed (built-in default 1.0)
#   custom-blocks:      section mapping custom-block type ids -> mass (Phase 6 hook; empty for now)

default: 1.0

# ── Buoyant-but-solid blocks: positive inertial mass, DECOUPLED from their negative buoyancy weight ──
glowstone: 1
sea_lantern: 1
beacon: 2
shroomlight: 1
ochre_froglight: 1
pearlescent_froglight: 1
verdant_froglight: 1
end_rod: 0                 # thin, no collider

# ── Wood family (weight 2) ──
"#planks": 2
"#logs": 2
"#wooden_slabs": 2        # slabs = full mass, no halving (mirrors BlockShips)
"#wooden_stairs": 2
"*_fence": 2
"*_fence_gate": 2
"*_door": 2
"*_trapdoor": 2
"*_button": 2
"*_pressure_plate": 2

# ── Textiles (weight 1) ──
