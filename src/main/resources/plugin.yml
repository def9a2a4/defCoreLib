name: DefCoreLib
main: anon.def9a2a4.corelib.CoreLibPlugin
version: ${version}
api-version: 1.21
author: def9a2a4
description: Shared core library for def plugins
commands:
  defcorelib:
    description: DefCoreLib commands
    usage: /defcorelib <catalog|give|give_demo|list|colliders|reloadbanners|cleanorphans> [args...]
    # No command-level permission: each subcommand is gated in code — `catalog` needs corelib.catalog
    # (default true), every other subcommand needs corelib.admin (default op).
permissions:
  corelib.admin:
    description: Administer DefCoreLib (give, list, reload, showcase, colliders, cleanup, etc.)
    default: op
    children:
      corelib.catalog: true
  corelib.catalog:
    description: Browse the DefCoreLib item catalog
    default: true
